<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Meter v2 - Simulator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #66ca66 0%, #e8f5e8 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 20px 80px 20px;
    }

    .container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(76, 175, 80, 0.15);
      width: 100%;
      max-width: 500px;
      padding: 40px;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
      padding-bottom: 25px;
      border-bottom: 2px solid #e0f2e0;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      gap: 12px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: white;
      font-weight: bold;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 700;
      color: #2e7d32;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: #66bb6a;
      font-weight: 500;
      margin-top: 8px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #1b5e20;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #c8e6c9;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s ease;
      background: #f1f8f1;
    }

    input:focus {
      outline: none;
      border-color: #4caf50;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.1);
    }

    input::placeholder {
      color: #81c784;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    button {
      flex: 1;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-send {
      background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
    }

    .btn-send:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
    }

    .btn-send:active {
      transform: translateY(0);
    }

    .btn-reset {
      background: #ffffff;
      color: #4caf50;
      border: 2px solid #4caf50;
    }

    .btn-reset:hover {
      background: #f1f8f1;
    }

    .status-message {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
      font-weight: 500;
    }

    .status-message.success {
      background: #e8f5e9;
      color: #2e7d32;
      border-left: 4px solid #4caf50;
    }

    .status-message.error {
      background: #ffebee;
      color: #c62828;
      border-left: 4px solid #f44336;
    }

    .info-section {
      margin-top: 24px;
      padding: 14px;
      background: #f1f8f1;
      border-radius: 8px;
      font-size: 12px;
      color: #558b2f;
      border-left: 4px solid #7cb342;
    }

    .info-section strong {
      color: #33691e;
    }

    .footer {
      background: linear-gradient(90deg, #4caf50 0%, #45a049 100%);
      color: white;
      text-align: center;
      padding: 16px 20px;
      font-size: 14px;
      font-weight: 500;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      box-shadow: 0 -4px 12px rgba(76, 175, 80, 0.2);
    }

    @media (max-width: 600px) {
      .container {
        padding: 24px;
      }

      .logo-text {
        font-size: 24px;
      }

      .logo-icon {
        width: 40px;
        height: 40px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div class="logo-text">Smart Meter v2</div>
    </div>
    <div class="subtitle">Data Simulator & Ingestion</div>
  </div>

  <form id="meterForm">
    <div class="form-group">
      <label for="cid">Consumer ID</label>
      <input type="text" id="cid" placeholder="e.g., C10001" required>
    </div>

    <div class="form-group">
      <label for="dk">Daily kWh</label>
      <input type="number" id="dk" placeholder="e.g., 15.5" step="0.01" required>
    </div>

    <div class="form-group">
      <label for="ck">Cumulative kWh</label>
      <input type="number" id="ck" placeholder="e.g., 450" step="0.01" required>
    </div>

    <div class="form-group">
      <label for="pk">Plan kWh</label>
      <input type="number" id="pk" placeholder="e.g., 500" step="0.01" required>
    </div>

    <div class="form-group">
      <label for="rc">Remaining Credit</label>
      <input type="number" id="rc" placeholder="e.g., 250" step="0.01" required>
    </div>

    <div class="button-group">
      <button type="button" class="btn-send" onclick="send()">Send Data</button>
      <button type="reset" class="btn-reset">Clear</button>
    </div>
  </form>

  <div id="statusMessage" class="status-message"></div>

  <div class="info-section">
    <strong>ℹ️ Info:</strong> This simulator sends meter data to the Smart Meter v2 analytics backend for anomaly detection and analysis.
  </div>
</div>

<script>
function send() {
  const cidValue = document.getElementById("cid").value;
  const dkValue = parseFloat(document.getElementById("dk").value);
  const ckValue = parseFloat(document.getElementById("ck").value);
  const pkValue = parseFloat(document.getElementById("pk").value);
  const rcValue = parseFloat(document.getElementById("rc").value);

  // Validation
  if (!cidValue || !dkValue || !ckValue || !pkValue || !rcValue) {
    showMessage("Please fill in all fields", "error");
    return;
  }

  if (pkValue <= 0) {
    showMessage("Plan kWh must be greater than 0", "error");
    return;
  }

  const data = {
    consumer_id: cidValue,
    daily_kwh: dkValue,
    cumulative_kwh: ckValue,
    plan_kwh: pkValue,
    remaining_credit: rcValue,
    usage_ratio: dkValue / pkValue
  };

  fetch("http://127.0.0.1:8000/hes/ingest", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(r => {
    showMessage("✓ Data sent successfully: " + JSON.stringify(r), "success");
    document.getElementById("meterForm").reset();
  })
  .catch(error => {
    showMessage("✗ Error sending data: " + error.message, "error");
  });
}

function showMessage(msg, type) {
  const statusDiv = document.getElementById("statusMessage");
  statusDiv.textContent = msg;
  statusDiv.className = "status-message " + type;
  statusDiv.style.display = "block";
  
  if (type === "success") {
    setTimeout(() => {
      statusDiv.style.display = "none";
    }, 4000);
  }
}
</script>

<footer class="footer">
  Powered by NamCode
</footer>

</body>
</html>
